<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Globe Art Viewer</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    background: #0e0f11;
    color: #e8e6e3;
    overflow: hidden;
  }
  canvas { display: block; }
  #panel {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 236px;
    padding: 14px 16px;
    border-radius: 10px;
    background: rgba(22, 23, 26, 0.82);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.09);
  }
  h1 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.01em; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .row span:last-child { font-variant-numeric: tabular-nums; opacity: 0.75; }
  label { display: block; margin-top: 10px; }
  select, input[type=range] { width: 100%; margin-top: 3px; }
  select {
    background: rgba(255, 255, 255, 0.07);
    color: inherit;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 6px;
    padding: 4px 6px;
  }
  #drop {
    margin-top: 12px;
    padding: 12px;
    text-align: center;
    border: 1px dashed rgba(255, 255, 255, 0.22);
    border-radius: 8px;
    opacity: 0.72;
    cursor: pointer;
  }
  #drop.over { border-color: #7aa2f7; opacity: 1; }
</style>
</head>
<body>
<div id="panel">
  <h1>Globe Art</h1>
  <div class="row"><span>cells</span><span id="cells">—</span></div>
  <div class="row"><span>capacity rms</span><span id="rms">—</span></div>
  <div class="row"><span>mass spread</span><span id="spread">—</span></div>
  <label>colour
    <select id="colouring">
      <option value="metal">metal</option>
      <option value="capacity">capacity error</option>
      <option value="area">cell area</option>
    </select>
  </label>
  <label>edge weight <input id="weight" type="range" min="1" max="30" value="9"></label>
  <div id="drop">drop a snapshot .json</div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0f11);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.9, 3.1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.minDistance = 1.6;
controls.maxDistance = 8;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3, 4, 2);
scene.add(key);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// The shell sits just inside the cell network so the far side reads as
// occluded rather than as a second layer of lines.
const shell = new THREE.Mesh(
  new THREE.SphereGeometry(0.985, 128, 128),
  new THREE.MeshStandardMaterial({ color: 0x14151a, roughness: 0.85, metalness: 0.0 })
);
scene.add(shell);

const group = new THREE.Group();
scene.add(group);

let snapshot = null;

const palette = value => new THREE.Color().setHSL(0.62 - 0.62 * value, 0.62, 0.52);

// Each bisector belongs to two cells, so it would otherwise be built twice
// and the two copies would fight for the same pixels.
function uniqueEdges(cells) {
  const seen = new Set();
  const edges = [];

  for (const cell of cells) {
    const boundary = cell.boundary;

    for (let i = 0; i < boundary.length; i++) {
      const from = boundary[i];
      const to = boundary[(i + 1) % boundary.length];
      const a = from.map(v => v.toFixed(6)).join();
      const b = to.map(v => v.toFixed(6)).join();
      const id = a < b ? a + '|' + b : b + '|' + a;

      if (!seen.has(id)) {
        seen.add(id);
        edges.push([from, to, cell]);
      }
    }
  }

  return edges;
}

function greatCircle(from, to, steps) {
  const a = new THREE.Vector3(...from).normalize();
  const b = new THREE.Vector3(...to).normalize();
  const points = [];

  for (let i = 0; i <= steps; i++) {
    points.push(new THREE.Vector3().lerpVectors(a, b, i / steps).normalize());
  }

  return points;
}

function build() {
  group.clear();

  if (!snapshot) return;

  const cells = snapshot.cells;
  const target = snapshot.targetMass;
  const masses = cells.map(c => c.mass);
  const areas = cells.map(c => c.area);
  const spread = (Math.max(...masses) - Math.min(...masses)) / target;

  document.getElementById('cells').textContent = cells.length;
  document.getElementById('rms').textContent = snapshot.relativeRmsCapacityError.toExponential(2);
  document.getElementById('spread').textContent = spread.toExponential(2);

  const mode = document.getElementById('colouring').value;
  const radius = document.getElementById('weight').value / 1200;
  const lowArea = Math.min(...areas);
  const highArea = Math.max(...areas);

  const shade = cell => {
    if (mode === 'capacity') {
      return palette(Math.min(1, Math.abs(cell.mass - target) / target * 40));
    }
    if (mode === 'area') {
      return palette((cell.area - lowArea) / Math.max(1e-12, highArea - lowArea));
    }
    return new THREE.Color(0xd9d2c5);
  };

  const material = mode === 'metal'
    ? new THREE.MeshPhysicalMaterial({ color: 0xd9d2c5, metalness: 1, roughness: 0.24 })
    : new THREE.MeshPhysicalMaterial({ vertexColors: true, metalness: 0.45, roughness: 0.4 });

  const geometries = [];

  for (const [from, to, cell] of uniqueEdges(cells)) {
    const curve = new THREE.CatmullRomCurve3(greatCircle(from, to, 6));
    const tube = new THREE.TubeGeometry(curve, 6, radius, 8, false);

    if (mode !== 'metal') {
      const colour = shade(cell);
      const count = tube.attributes.position.count;
      const colours = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        colours[i * 3] = colour.r;
        colours[i * 3 + 1] = colour.g;
        colours[i * 3 + 2] = colour.b;
      }

      tube.setAttribute('color', new THREE.BufferAttribute(colours, 3));
    }

    geometries.push(tube);
  }

  for (const geometry of geometries) {
    group.add(new THREE.Mesh(geometry, material));
  }

  const joint = new THREE.SphereGeometry(radius, 8, 8);
  const joints = new THREE.InstancedMesh(joint, material, cells.length * 8);
  let index = 0;
  const matrix = new THREE.Matrix4();

  for (const cell of cells) {
    for (const point of cell.boundary) {
      if (index >= joints.count) break;
      matrix.setPosition(...point);
      joints.setMatrixAt(index++, matrix);
    }
  }

  joints.count = index;
  group.add(joints);
}

function load(text) {
  snapshot = JSON.parse(text);
  build();
}

for (const id of ['colouring', 'weight']) {
  document.getElementById(id).addEventListener('input', build);
}

const drop = document.getElementById('drop');
drop.addEventListener('click', () => {
  const picker = document.createElement('input');
  picker.type = 'file';
  picker.accept = '.json';
  picker.onchange = () => picker.files[0].text().then(load);
  picker.click();
});

document.addEventListener('dragover', event => {
  event.preventDefault();
  drop.classList.add('over');
});
document.addEventListener('dragleave', () => drop.classList.remove('over'));
document.addEventListener('drop', event => {
  event.preventDefault();
  drop.classList.remove('over');
  event.dataTransfer.files[0].text().then(load);
});

const requested = new URLSearchParams(location.search).get('snapshot');
if (requested) {
  fetch(requested).then(response => response.text()).then(load).catch(() => {});
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
