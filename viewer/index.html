<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Globe Art Viewer</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    background: #0e0f11;
    color: #e8e6e3;
    overflow: hidden;
  }
  canvas { display: block; }
  #panel {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 272px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    padding: 14px 16px;
    border-radius: 10px;
    background: rgba(22, 23, 26, 0.82);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.09);
    scrollbar-width: thin;
  }
  h1 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.01em; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .row span:last-child { font-variant-numeric: tabular-nums; opacity: 0.75; }
  label { display: block; margin-top: 10px; }
  select, input[type=range], input[type=number], input[type=text] { width: 100%; margin-top: 3px; }
  select, input[type=number], input[type=text] {
    background: rgba(255, 255, 255, 0.07);
    color: inherit;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 6px;
    padding: 4px 6px;
    font: inherit;
  }
  input[type=number] { font-variant-numeric: tabular-nums; }
  h2 {
    margin: 16px 0 6px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.09);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.6;
  }
  #studio { display: none; }
  #studio.available { display: block; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .grid label { margin-top: 4px; font-size: 12px; opacity: 0.85; }
  button {
    font: inherit;
    color: inherit;
    background: rgba(122, 162, 247, 0.22);
    border: 1px solid rgba(122, 162, 247, 0.5);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  button:hover { background: rgba(122, 162, 247, 0.35); }
  button.quiet {
    background: transparent;
    border-color: transparent;
    padding: 0 4px;
    opacity: 0.55;
  }
  button.quiet:hover { opacity: 1; }
  #run { width: 100%; margin-top: 10px; }
  #error { color: #f7768e; margin-top: 6px; min-height: 1em; }
  #runs { list-style: none; margin: 0; padding: 0; }
  #runs li {
    display: grid;
    grid-template-columns: 8px 1fr auto;
    gap: 8px;
    align-items: start;
    padding: 6px 6px;
    margin: 0 -6px;
    border-radius: 6px;
    cursor: pointer;
  }
  #runs li:hover { background: rgba(255, 255, 255, 0.05); }
  #runs li.selected { background: rgba(122, 162, 247, 0.14); }
  #runs .dot { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: #6b7280; }
  #runs .dot.running { background: #7aa2f7; box-shadow: 0 0 0 3px rgba(122, 162, 247, 0.25); }
  #runs .dot.queued { background: #e0af68; }
  #runs .dot.finished { background: #9ece6a; }
  #runs .dot.failed, #runs .dot.interrupted { background: #f7768e; }
  #runs .title { font-weight: 600; }
  #runs .detail { opacity: 0.65; font-variant-numeric: tabular-nums; }
  #log {
    margin-top: 8px;
    padding: 8px;
    max-height: 150px;
    overflow: auto;
    font: 11px/1.45 ui-monospace, Menlo, monospace;
    white-space: pre;
    background: rgba(0, 0, 0, 0.35);
    border-radius: 6px;
    opacity: 0.85;
  }
  #log:empty { display: none; }
  #preview { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.55; }
  #drop {
    margin-top: 12px;
    padding: 12px;
    text-align: center;
    border: 1px dashed rgba(255, 255, 255, 0.22);
    border-radius: 8px;
    opacity: 0.72;
    cursor: pointer;
  }
  #drop.over { border-color: #7aa2f7; opacity: 1; }
</style>
</head>
<body>
<div id="panel">
  <h1>Globe Art</h1>
  <div class="row"><span>cells</span><span id="cells">—</span></div>
  <div class="row"><span>capacity rms</span><span id="rms">—</span></div>
  <div class="row"><span>mass spread</span><span id="spread">—</span></div>
  <div class="row"><span id="preview"></span></div>
  <label>colour
    <select id="colouring">
      <option value="metal">metal</option>
      <option value="capacity">capacity error</option>
      <option value="area">cell area</option>
    </select>
  </label>
  <label>edge weight <input id="weight" type="range" min="1" max="30" value="9"></label>
  <div id="drop">drop a snapshot .json</div>

  <div id="studio">
    <h2>Run</h2>
    <div class="grid">
      <label>points <input id="points" type="number" min="2" max="20000" value="200"></label>
      <label>field
        <select id="density_field">
          <option value="noise-smooth">noise (C1 spline)</option>
          <option value="noise">noise (kinked)</option>
          <option value="noise-fit">noise (global fit)</option>
          <option value="quadratic">quadratic</option>
          <option value="quadratic-piecewise">quadratic (tiles)</option>
          <option value="linear">linear</option>
          <option value="constant">constant</option>
        </select>
      </label>
      <label>seed <input id="seed" type="number" min="0" placeholder="random"></label>
      <label>tolerance <input id="capacity_tolerance" type="text" value="1e-7"></label>
      <label>warm start
        <select id="warm_start">
          <option value="lloyd">lloyd</option>
          <option value="newton">newton</option>
        </select>
      </label>
      <label>lloyd passes <input id="lloyd_passes" type="number" min="0" max="1000" value="5"></label>
      <label>inner solver
        <select id="inner_solver">
          <option value="lbfgs">lbfgs</option>
          <option value="newton">newton</option>
        </select>
      </label>
      <label>max outer <input id="max_outer_iterations" type="number" min="1" max="1000" value="30"></label>
      <label>max inner <input id="max_inner_iterations" type="number" min="1" max="100000" value="200"></label>
      <label>newton warm steps <input id="newton_iterations" type="number" min="0" max="10000" value="50"></label>
    </div>
    <button id="run">Run</button>
    <div id="error"></div>

    <h2>Runs</h2>
    <ul id="runs"></ul>
    <div id="log"></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0f11);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.85, 3.9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.minDistance = 1.6;
controls.maxDistance = 8;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3, 4, 2);
scene.add(key);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// The shell sits just inside the cell network so the far side reads as
// occluded rather than as a second layer of lines.
const shell = new THREE.Mesh(
  new THREE.SphereGeometry(0.985, 128, 128),
  new THREE.MeshStandardMaterial({ color: 0x14151a, roughness: 0.85, metalness: 0.0 })
);
scene.add(shell);

const group = new THREE.Group();
scene.add(group);

let snapshot = null;

const palette = value => new THREE.Color().setHSL(0.62 - 0.62 * value, 0.62, 0.52);

// Each bisector belongs to two cells, so it would otherwise be built twice
// and the two copies would fight for the same pixels.
function uniqueEdges(cells) {
  const seen = new Set();
  const edges = [];

  for (const cell of cells) {
    const boundary = cell.boundary;

    for (let i = 0; i < boundary.length; i++) {
      const from = boundary[i];
      const to = boundary[(i + 1) % boundary.length];
      const a = from.map(v => v.toFixed(6)).join();
      const b = to.map(v => v.toFixed(6)).join();
      const id = a < b ? a + '|' + b : b + '|' + a;

      if (!seen.has(id)) {
        seen.add(id);
        edges.push([from, to, cell]);
      }
    }
  }

  return edges;
}

function greatCircle(from, to, steps) {
  const a = new THREE.Vector3(...from).normalize();
  const b = new THREE.Vector3(...to).normalize();
  const points = [];

  for (let i = 0; i <= steps; i++) {
    points.push(new THREE.Vector3().lerpVectors(a, b, i / steps).normalize());
  }

  return points;
}

// The whole view is addressable, so a particular reading of a particular
// run can be linked rather than described.
const query = new URLSearchParams(location.search);

// The studio: present only when the page is served by viewer/server.py,
// which runs generate_globe on request. A run's snapshot is rewritten while
// it is in flight, so polling its version is enough to watch it evolve.
const studio = {
  fields: ['points', 'density_field', 'seed', 'capacity_tolerance', 'warm_start', 'lloyd_passes',
           'inner_solver', 'max_outer_iterations', 'max_inner_iterations', 'newton_iterations'],
  selected: query.get('run'),
  version: null,
  runs: [],
  live: false,
};

// Rebuilds are the expensive part and they happen every time a live run
// writes a snapshot, so each one disposes what it replaces, merges into a
// single geometry, and drops to lines while a large run is still moving.
const PREVIEW_CELLS = 400;

let built = [];
let building = false;
let buildMilliseconds = 0;

function dispose() {
  for (const resource of built) resource.dispose();
  built = [];
  group.clear();
}

function build() {
  const started = performance.now();
  dispose();

  if (!snapshot) return;

  const cells = snapshot.cells;
  const target = snapshot.targetMass;
  const masses = cells.map(c => c.mass);
  const areas = cells.map(c => c.area);
  const spread = (Math.max(...masses) - Math.min(...masses)) / target;

  document.getElementById('cells').textContent = cells.length;
  document.getElementById('rms').textContent = snapshot.relativeRmsCapacityError.toExponential(2);
  document.getElementById('spread').textContent = spread.toExponential(2);

  const mode = document.getElementById('colouring').value;
  const radius = document.getElementById('weight').value / 1200;
  const lowArea = Math.min(...areas);
  const highArea = Math.max(...areas);

  // Scaled to the errors actually present rather than to a fixed multiple of
  // the target: at convergence a fixed scale reports one flat colour, which
  // says the solver worked but shows nothing about where the residue sits.
  const worstError = Math.max(1e-300, ...cells.map(c => Math.abs(c.mass - target)));

  const shade = cell => {
    if (mode === 'capacity') {
      return palette(Math.abs(cell.mass - target) / worstError);
    }
    if (mode === 'area') {
      return palette((cell.area - lowArea) / Math.max(1e-12, highArea - lowArea));
    }
    return new THREE.Color(0xd9d2c5);
  };

  const edges = uniqueEdges(cells);
  const preview = studio.live && cells.length > PREVIEW_CELLS;

  document.getElementById('preview').textContent = preview ? 'outline while running' : '';

  if (preview) {
    buildLines(edges, shade);
  } else {
    buildTubes(edges, cells, shade, mode, radius);
  }

  buildMilliseconds = performance.now() - started;
}

// Two vertices per segment, one buffer, one draw call: cheap enough to
// rebuild every time a running solver reports a new tessellation.
function buildLines(edges, shade) {
  const positions = [];
  const colours = [];

  for (const [from, to, cell] of edges) {
    const points = greatCircle(from, to, 4);
    const colour = shade(cell);

    for (let i = 0; i < points.length - 1; i++) {
      positions.push(points[i].x, points[i].y, points[i].z, points[i + 1].x, points[i + 1].y, points[i + 1].z);
      colours.push(colour.r, colour.g, colour.b, colour.r, colour.g, colour.b);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colours, 3));

  const material = new THREE.LineBasicMaterial({ vertexColors: true });
  group.add(new THREE.LineSegments(geometry, material));
  built = [geometry, material];
}

function buildTubes(edges, cells, shade, mode, radius) {
  const material = mode === 'metal'
    ? new THREE.MeshPhysicalMaterial({ color: 0xd9d2c5, metalness: 1, roughness: 0.24 })
    : new THREE.MeshPhysicalMaterial({ vertexColors: true, metalness: 0.45, roughness: 0.4 });

  const radial = cells.length > 400 ? 5 : 8;
  const tubes = [];

  for (const [from, to, cell] of edges) {
    const curve = new THREE.CatmullRomCurve3(greatCircle(from, to, 6));
    const tube = new THREE.TubeGeometry(curve, 6, radius, radial, false);
    tube.deleteAttribute('uv');

    const colour = shade(cell);
    const count = tube.attributes.position.count;
    const colours = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
      colours[i * 3] = colour.r;
      colours[i * 3 + 1] = colour.g;
      colours[i * 3 + 2] = colour.b;
    }

    tube.setAttribute('color', new THREE.BufferAttribute(colours, 3));
    tubes.push(tube);
  }

  const merged = mergeGeometries(tubes);
  for (const tube of tubes) tube.dispose();
  group.add(new THREE.Mesh(merged, material));

  const joint = new THREE.SphereGeometry(radius, radial, radial);
  const joints = new THREE.InstancedMesh(joint, material, cells.reduce((n, c) => n + c.boundary.length, 0));
  let index = 0;
  const matrix = new THREE.Matrix4();

  for (const cell of cells) {
    for (const point of cell.boundary) {
      matrix.setPosition(...point);
      joints.setMatrixAt(index++, matrix);
    }
  }

  joints.count = index;
  group.add(joints);

  // The instanced mesh owns a GPU buffer of its own, separate from the
  // geometry it draws, and it is not freed by removing it from the scene.
  built = [merged, joint, material, joints];
}

// Slider drags and poll ticks request rebuilds faster than they are worth
// doing; coalesce to one per frame.
let buildQueued = false;

function requestBuild() {
  if (buildQueued) return;
  buildQueued = true;
  requestAnimationFrame(() => {
    buildQueued = false;
    build();
  });
}

function load(text) {
  snapshot = JSON.parse(text);
  build();
}

for (const id of ['colouring', 'weight']) {
  document.getElementById(id).addEventListener('input', requestBuild);
}

const drop = document.getElementById('drop');
drop.addEventListener('click', () => {
  const picker = document.createElement('input');
  picker.type = 'file';
  picker.accept = '.json';
  picker.onchange = () => picker.files[0].text().then(load);
  picker.click();
});

document.addEventListener('dragover', event => {
  event.preventDefault();
  drop.classList.add('over');
});
document.addEventListener('dragleave', () => drop.classList.remove('over'));
document.addEventListener('drop', event => {
  event.preventDefault();
  drop.classList.remove('over');
  event.dataTransfer.files[0].text().then(load);
});

for (const [parameter, id] of [['colour', 'colouring'], ['weight', 'weight']]) {
  const value = query.get(parameter);
  if (value) document.getElementById(id).value = value;
}

const requested = query.get('snapshot');
if (requested) {
  fetch(requested).then(response => response.text()).then(load).catch(() => {});
}

async function api(path, options) {
  const response = await fetch(path, options);
  const payload = await response.json();
  if (!response.ok) throw new Error(payload.error || response.statusText);
  return payload;
}

function parameters() {
  const values = {};
  for (const id of studio.fields) values[id] = document.getElementById(id).value;
  return values;
}

function describe(run) {
  const p = run.parameters;
  return `${p.points} · ${p.density_field} · ${p.inner_solver}` + (p.seed != null ? ` · seed ${p.seed}` : '');
}

function elapsed(run) {
  if (!run.started) return '';
  const seconds = ((run.finished || Date.now() / 1000) - run.started);
  return seconds < 90 ? `${seconds.toFixed(0)}s` : `${(seconds / 60).toFixed(1)}m`;
}

function renderRuns() {
  const list = document.getElementById('runs');
  list.replaceChildren();

  for (const run of studio.runs) {
    const item = document.createElement('li');
    item.className = run.id === studio.selected ? 'selected' : '';
    item.addEventListener('click', () => select(run.id));

    const dot = document.createElement('span');
    dot.className = `dot ${run.status}`;

    const text = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = describe(run);
    const detail = document.createElement('div');
    detail.className = 'detail';
    const summary = run.summary ? run.summary.replace(/^\s*Final\s*/, '') : run.status;
    detail.textContent = `${summary} ${elapsed(run)}`.trim();
    text.append(title, detail);

    const action = document.createElement('button');
    action.className = 'quiet';
    const active = run.status === 'running' || run.status === 'queued';
    action.textContent = active ? 'stop' : '×';
    action.title = active ? 'cancel this run' : 'delete this run';
    action.addEventListener('click', async event => {
      event.stopPropagation();
      await api(`/api/runs/${run.id}` + (active ? '/cancel' : ''), { method: active ? 'POST' : 'DELETE' });
      if (!active && studio.selected === run.id) studio.selected = null;
      refreshRuns();
    });

    item.append(dot, text, action);
    list.append(item);
  }
}

async function refreshRuns() {
  studio.runs = await api('/api/runs');
  renderRuns();
}

function select(id) {
  studio.selected = id;
  studio.version = null;
  history.replaceState(null, '', `?run=${id}`);
  renderRuns();
  poll();
}

async function poll() {
  if (!studio.selected) return;
  const run = await api(`/api/runs/${studio.selected}`);
  document.getElementById('log').textContent = run.log.slice(-12).join('\n');

  const live = run.status === 'running' || run.status === 'queued';
  const settled = studio.live && !live;
  studio.live = live;

  // A rebuild can take longer than the poll interval on a large run, so a
  // new snapshot is only fetched once the previous one has been drawn.
  const changed = run.snapshot && run.snapshot_version !== studio.version;

  if (!building && (changed || settled)) {
    building = true;

    try {
      if (changed) {
        studio.version = run.snapshot_version;
        const text = await (await fetch(`${run.snapshot}?v=${run.snapshot_version}`)).text();
        snapshot = JSON.parse(text);
      }

      build();
    } finally {
      building = false;
    }
  }

  const index = studio.runs.findIndex(r => r.id === run.id);
  if (index >= 0 && studio.runs[index].status !== run.status) refreshRuns();
}

async function startRun() {
  document.getElementById('error').textContent = '';
  try {
    const run = await api('/api/runs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(parameters()),
    });
    await refreshRuns();
    select(run.id);
  } catch (error) {
    document.getElementById('error').textContent = error.message;
  }
}

api('/api/runs').then(runs => {
  studio.runs = runs;
  document.getElementById('studio').classList.add('available');
  document.getElementById('run').addEventListener('click', startRun);
  renderRuns();
  if (studio.selected) poll();
  // Polling never costs more than a fraction of the time spent drawing, so
  // a run whose tessellation is expensive to draw simply updates less often.
  const tick = async () => {
    await poll().catch(() => {});

    if (studio.runs.some(r => r.status === 'running' || r.status === 'queued')) {
      await refreshRuns().catch(() => {});
    }

    setTimeout(tick, Math.min(8000, Math.max(1000, 4 * buildMilliseconds)));
  };

  tick();
}).catch(() => {});

function frame() {
  camera.aspect = innerWidth / innerHeight;
  const vertical = THREE.MathUtils.degToRad(camera.fov) / 2;
  const horizontal = Math.atan(Math.tan(vertical) * camera.aspect);
  const distance = 1.12 / Math.sin(Math.min(vertical, horizontal));

  camera.position.setLength(distance);
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

addEventListener('resize', frame);
frame();

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
